# Sleepy LLM configuration.
# Override any of these on the classpath by setting the SLEEPY_LLM_CONFIG env var
# to the path of a file that overrides them (e.g. one that sets wake.mode and a
# real wake command once it is known).
sleepyllm {
  # Where the reverse proxy itself listens.
  proxy {
    host = "0.0.0.0"
    port = 8080
  }

  # The inference server we proxy to and wake on demand.
  backend {
    scheme = "http"
    host = "127.0.0.1"
    port = 8000

    # Endpoint used to decide whether the backend is awake and ready.
    # Defaults to the OpenAI-compatible /v1/models, the API surface shared by
    # vLLM/SGLang/TGI/llama.cpp/Ollama etc. Override per server when a dedicated
    # readiness endpoint exists instead (e.g. /health on vLLM/TGI/llama.cpp).
    health {
      path = "/v1/models"
      # How long to wait after sending a wake signal before giving up.
      timeout = 60s
      # How often to probe the health endpoint while the backend boots.
      poll-interval = 1s
    }

    # Cache of the OpenAI-compatible /v1/models response, written atomically on
    # each successful fetch of it (a health probe when health.path is /v1/models,
    # or a forwarded GET). The proxy serves this copy instead of waking the
    # backend when the backend is not ready, so model-list polling never wakes it.
    # Empty string = disabled (the endpoint always wakes and forwards then).
    models-cache-file = "./sleepy-llm-models.json"

    # Down-detection while the proxy believes the backend is READY. The proxy
    # probes the health endpoint periodically and, after `failures` consecutive
    # failed probes, treats the backend as powered down (ASLEEP) so the next
    # request wakes it on demand again. Polling only runs while the backend is
    # awake, so it never itself causes a wake. Reactive detection — a forwarded
    # request that cannot connect — always runs regardless of this block.
    monitor {
      enabled = true
      # How often to probe the health endpoint while READY. Deliberately slow (10s):
      # latency-sensitive down detection is the reactive path (a forwarded request
      # that cannot connect flips instantly); this just catches a backend powered
      # off while idle.
      interval = 10s
      # Per-probe connect+request deadline. Kept short so detection is fast and a
      # stale keep-alive connection cannot stall the probe. Request-scoped; never
      # affects forwarded requests. Must stay well below backend.health.timeout.
      timeout = 1s
      # Consecutive failed probes after which READY is treated as down (ASLEEP).
      failures = 3
    }
  }

  # How to wake the machine hosting the backend.
  wake {
    # "dummy" does nothing (safe default until a real wake command is configured).
    # "command" runs `wake.command` verbatim.
    mode = "dummy"
    # The wake command, as argv, run via ProcessBuilder with no shell — exactly
    # like shutdown.command. Fully user-specified: the MAC address and any
    # broadcast/interface flags are part of this list, e.g.
    #   ["wakeonlan", "-i", "192.168.10.255", "aa:bb:cc:dd:ee:ff"]
    # (the -i broadcast is only needed when the backend machine is on a different
    # subnet; without it the tool uses its default broadcast). Ignored while
    # mode = "dummy".
    command = []
  }

  # Idle shutdown of the machine hosting the backend. Opt-in: the proxy never
  # powers the machine down unless this block is enabled and configured.
  shutdown {
    enabled = false
    # Power down after this long with no real requests (and, when check-command is
    # set, no logged-in users). Any real request -- other than /v1/models, which a
    # polling dashboard would otherwise keep the machine alive forever -- resets
    # the clock; so does an observed logged-in user (per check-command).
    idle-timeout = 30m
    # How often to re-check the login guard and the idle clock while READY.
    poll-interval = 1m
    # Command that powers the machine down, as argv, run via ProcessBuilder with
    # no shell. The proxy can never run on the backend machine itself (it would
    # shut itself down), so this is typically remote,
    # e.g. ["ssh", "user@host", "sudo", "poweroff"].
    command = []
    # Optional guard: exit 0 = nobody is logged in (safe to shut down); any other
    # exit (or an un-runnable command) = someone is logged in, so shutdown is
    # deferred. Suggest an ssh one-liner whose exit code is 0 only when no one is
    # logged into the machine. Without it the proxy assumes full control of the
    # lifecycle and shuts down on idle alone.
    check-command = []
  }
}
